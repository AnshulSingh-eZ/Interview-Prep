services:

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_prep_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend

    env_file:
    - .env

    environment:
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

volumes:
  postgres_data: